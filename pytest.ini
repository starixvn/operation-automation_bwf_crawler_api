[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests

# Ignore paths
norecursedirs = .git .tox dist build *.egg __pycache__ .pytest_cache

# Asyncio settings
asyncio_mode = auto

